<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | PMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,500;6..12,600;6..12,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="dashboard-container">
        <!-- Menu Lateral Fixo -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-area">
                    <img src="assets/Layer_x0020_1.png" alt="AgroTech Logo" />
                </div>
                <nav class="sidebar-nav">
                    <button class="nav-btn active" data-view="users">
                        <i class="fas fa-users"></i>
                        <span>Usuários</span>
                    </button>
                    <button class="nav-btn" data-view="farms">
                        <i class="fas fa-tractor"></i>
                        <span>Fazendas</span>
                    </button>
                </nav>

                <!-- Botão para adicionar admin -->
                <div class="sidebar-add-admin">
                    <button class="add-admin-btn" onclick="openAddAdminModal()">
                        <i class="fas fa-user-plus"></i>
                        <span>Cadastrar Administrador</span>
                    </button>
                </div>
            </div>
            <div class="sidebar-bottom">
                <div class="developer-logo">
                    <img src="assets/Frame-3.png" alt="SBMI" />
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Barra Superior -->
            <header class="top-bar">
                <div class="current-screen">
                    <h1 id="screen-title">Usuários</h1>
                </div>

                <!-- Campo de pesquisa no meio da top bar -->
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Pesquisar..."
                        oninput="handleSearch()">
                </div>

                <div class="user-info">
                    <span class="user-name" id="userName">João Silva</span>
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>
            </header>

            <!-- Área de Conteúdo -->
            <div class="content-area">
                <!-- Loading State -->
                <div class="loading-spinner" id="loadingSpinner">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>

                <!-- Lista de Itens -->
                <div class="items-list" id="itemsList"></div>

                <!-- Container para paginação e contador -->
                <div class="pagination-container">
                    <!-- Paginação -->
                    <div class="pagination" id="pagination"></div>

                    <!-- Contador de itens -->
                    <div class="items-counter" id="itemsCounter"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Detalhes -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Detalhes</h2>
                <button class="close-modal" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo dinâmico -->
            </div>
        </div>
    </div>

    <!-- Modal para adicionar Admin -->
    <div class="modal" id="addAdminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cadastrar Administrador</h2>
                <button class="close-modal" onclick="closeAddAdminModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addAdminForm" onsubmit="handleAddAdmin(event)">
                    <div class="form-group">
                        <label for="adminName">Nome completo</label>
                        <input type="text" id="adminName" class="form-input" placeholder="Digite o nome completo"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="adminEmail">E-mail</label>
                        <input type="email" id="adminEmail" class="form-input" placeholder="Digite o e-mail" required>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="closeAddAdminModal()">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-primary">
                            Adicionar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>

</html>
